<!doctype html><meta charset="utf-8"><title>typing-fixture:</title>
<style>html,body{margin:0;height:100%}textarea{position:fixed;inset:0;width:100%;height:100%;box-sizing:border-box;font:16px monospace;border:0}</style>
<!-- myLinux typing fixture: the textarea fills the viewport (a click anywhere lands in it, whatever the tile size) and every
     character typed into it is mirrored into the window title, which the compositor's diagnostics can read. -->
<textarea id="t" autofocus></textarea>
<script>
const t = document.getElementById('t');
const update = () => { document.title = 'typing-fixture:' + t.value.replace(/\n/g, '\\n'); };
t.addEventListener('input', update); window.addEventListener('load', () => { t.focus(); update(); });
</script>
