# myLinux: this machine was made with its first-start answers given (mylinux create omarchy --unattended, or the
# launcher's dialog), or with Claude Code and Codex to set up in it, or both. /var/lib/mylinux/provision runs Omarchy's
# own setup, with the answers when there are any, sets Claude Code and Codex up in the new account, and removes this
# file, the answers and the request afterwards.
[Service]
ExecStart=
ExecStart=/var/lib/mylinux/provision
