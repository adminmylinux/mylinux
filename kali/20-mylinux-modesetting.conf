# myLinux: the machine's display is QEMU's virtio GPU, whose OpenGL is drawn by ANGLE on the Mac. Xorg's own use of
# it (glamor) sends commands that renderer refuses ("Illegal command buffer", a black screen), so X draws in
# software here; with a Mac's processor behind it that is fast enough for Xfce.
Section "Device"
    Identifier "virtio-gpu"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
